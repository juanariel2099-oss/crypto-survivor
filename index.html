<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Survivor</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes pulse-glow {
            0%, 100% { transform: scale(1); box-shadow: 0 0 20px rgba(16, 185, 129, 0.4); }
            50% { transform: scale(1.05); box-shadow: 0 0 35px rgba(16, 185, 129, 0.8); }
        }
        .crypto-coin {
            animation: pulse-glow 3s infinite;
            transition: transform 0.08s ease;
        }
        .crypto-coin:active {
            transform: scale(0.9) rotate(-3deg);
        }
        /* Animación para el texto flotante de ganancias (+1) */
        @keyframes float-up {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-70px) scale(1.3); }
        }
        .floating-text {
            position: absolute;
            pointer-events: none;
            font-weight: 800;
            color: #34d399;
            text-shadow: 0 0 8px rgba(52, 211, 153, 0.8);
            animation: float-up 0.8s ease-out forwards;
            z-index: 50;
        }
        /* Partículas de brillo */
        @keyframes particle-pop {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--tw-translate-x), var(--tw-translate-y)) scale(0); opacity: 0; }
        }
        .sparkle {
            position: absolute;
            width: 8px;
            height: 8px;
            background-color: #f59e0b;
            border-radius: 50%;
            pointer-events: none;
            animation: particle-pop 0.6s ease-out forwards;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between p-4 font-sans select-none pb-8 overflow-hidden">

    <!-- Header / Info del usuario -->
    <header class="w-full max-w-md mx-auto bg-slate-900/80 border border-slate-800 p-3 rounded-2xl backdrop-blur-md shadow-lg space-y-2">
        <div class="flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-emerald-500 to-cyan-500 flex items-center justify-center font-bold text-slate-950 text-lg shadow-md" id="user-avatar">CS</div>
                <div>
                    <h1 id="user-name" class="font-bold text-sm text-emerald-400">Crypto Survivor</h1>
                    <p class="text-xs text-slate-400">Rango: <span id="user-rank" class="text-amber-400 font-semibold">Novato</span></p>
                </div>
            </div>
            <div class="bg-slate-950 px-3 py-1 rounded-full border border-slate-800 text-xs text-emerald-400 font-mono" id="market-status">
                🟢 Bull Market
            </div>
        </div>
        <!-- Barra de Progreso de Rango -->
        <div class="w-full bg-slate-950 rounded-full h-1.5 overflow-hidden border border-slate-800">
            <div id="rank-bar" class="bg-gradient-to-r from-emerald-500 to-cyan-400 h-full w-0 transition-all duration-300"></div>
        </div>
    </header>

    <!-- Zona central: Contador y Moneda clickeable -->
    <main class="w-full max-w-md mx-auto flex flex-col items-center justify-center my-4 relative">
        <div class="text-center mb-4">
            <p class="text-xs uppercase tracking-widest text-slate-400 mb-1 font-semibold">Balance Total</p>
            <div class="flex items-center justify-center space-x-2">
                <span class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-400 font-mono" id="score">0</span>
                <span class="text-xl font-bold text-emerald-500">USDT</span>
            </div>
            <p class="text-xs text-slate-500 mt-1">+<span id="click-power-text">1</span> por toque | +<span id="cps-text">0</span>/seg</p>
        </div>

        <!-- Botón principal de la moneda -->
        <div id="coin-container" class="relative flex items-center justify-center">
            <button id="tap-btn" class="crypto-coin w-36 h-36 rounded-full bg-gradient-to-b from-emerald-400 to-emerald-700 flex flex-col items-center justify-center shadow-2xl border-4 border-emerald-300/40 relative active:brightness-110 my-2 cursor-pointer">
                <span class="text-5xl filter drop-shadow-md">🪙</span>
                <span class="text-[10px] font-bold text-slate-950 uppercase tracking-wider mt-1 bg-white/20 px-2 py-0.5 rounded-full">¡MINAR!</span>
            </button>
        </div>
    </main>

    <!-- TIENDA DE MEJORAS -->
    <section class="w-full max-w-md mx-auto bg-slate-900/90 border border-slate-800 p-4 rounded-2xl shadow-xl space-y-3">
        <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">🛒 Tienda de Mejoras</h2>

        <!-- Mejora 1: Clics -->
        <div class="flex items-center justify-between bg-slate-950 p-3 rounded-xl border border-slate-800">
            <div>
                <p class="text-xs font-bold text-emerald-400">⚡ Fuerza de Clic (+1/toque)</p>
                <p class="text-[10px] text-slate-400">Costo: <span id="click-cost" class="text-amber-400 font-semibold">10</span> USDT</p>
            </div>
            <button id="buy-click-btn" class="bg-emerald-600 active:bg-emerald-700 text-slate-950 text-xs font-bold px-3 py-2 rounded-lg transition-all disabled:opacity-40">
                Comprar
            </button>
        </div>

        <!-- Mejora 2: Auto Minero 1 -->
        <div class="flex items-center justify-between bg-slate-950 p-3 rounded-xl border border-slate-800">
            <div>
                <p class="text-xs font-bold text-cyan-400">💻 Rig de Minería (+1/seg)</p>
                <p class="text-[10px] text-slate-400">Costo: <span id="miner-cost" class="text-amber-400 font-semibold">50</span> USDT</p>
            </div>
            <button id="buy-miner-btn" class="bg-cyan-600 active:bg-cyan-700 text-slate-950 text-xs font-bold px-3 py-2 rounded-lg transition-all disabled:opacity-40">
                Comprar
            </button>
        </div>

        <!-- Mejora 3: Granja Crypto -->
        <div class="flex items-center justify-between bg-slate-950 p-3 rounded-xl border border-slate-800">
            <div>
                <p class="text-xs font-bold text-purple-400">🏭 Granja Crypto (+5/seg)</p>
                <p class="text-[10px] text-slate-400">Costo: <span id="farm-cost" class="text-amber-400 font-semibold">250</span> USDT</p>
            </div>
            <button id="buy-farm-btn" class="bg-purple-600 active:bg-purple-700 text-slate-950 text-xs font-bold px-3 py-2 rounded-lg transition-all disabled:opacity-40">
                Comprar
            </button>
        </div>
    </section>

    <script>
        let state = {
            score: 0,
            clickPower: 1,
            cps: 0,
            clickCost: 10,
            minerCost: 50,
            farmCost: 250
        };

        const saved = localStorage.getItem('crypto_survivor_save');
        if (saved) {
            try { state = { ...state, ...JSON.parse(saved) }; } catch(e){}
        }

        const scoreEl = document.getElementById('score');
        const tapBtn = document.getElementById('tap-btn');
        const coinContainer = document.getElementById('coin-container');
        const clickPowerText = document.getElementById('click-power-text');
        const cpsText = document.getElementById('cps-text');
        const userNameEl = document.getElementById('user-name');
        const userAvatarEl = document.getElementById('user-avatar');
        const userRankEl = document.getElementById('user-rank');
        const rankBarEl = document.getElementById('rank-bar');

        const clickCostEl = document.getElementById('click-cost');
        const minerCostEl = document.getElementById('miner-cost');
        const farmCostEl = document.getElementById('farm-cost');

        const buyClickBtn = document.getElementById('buy-click-btn');
        const buyMinerBtn = document.getElementById('buy-miner-btn');
        const buyFarmBtn = document.getElementById('buy-farm-btn');

        if (window.Telegram && window.Telegram.WebApp) {
            const tg = window.Telegram.WebApp;
            tg.expand();
            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                const user = tg.initDataUnsafe.user;
                userNameEl.textContent = user.first_name || "Crypto Survivor";
                if (user.first_name) {
                    userAvatarEl.textContent = user.first_name.charAt(0).toUpperCase();
                }
            }
        }

        // Manejar el toque y efectos visuales
        tapBtn.addEventListener('click', (e) => {
            state.score += state.clickPower;
            
            // Crear el texto flotante (+1, +2, etc.)
            createFloatingText(e);
            // Crear destellos alrededor del clic
            createSparkles(e);

            updateUI();
            saveGame();

            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback) {
                window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
            }
        });

        function createFloatingText(e) {
            const rect = tapBtn.getBoundingClientRect();
            const text = document.createElement('div');
            text.className = 'floating-text font-mono text-xl';
            text.textContent = `+${state.clickPower}`;

            // Posición basada en el clic o centro si no hay eventos
            const x = (e.clientX || rect.left + rect.width / 2) - rect.left - 10;
            const y = (e.clientY || rect.top + rect.height / 2) - rect.top - 20;

            text.style.left = `${x}px`;
            text.style.top = `${y}px`;

            coinContainer.appendChild(text);

            setTimeout(() => {
                text.remove();
            }, 800);
        }

        function createSparkles(e) {
            const rect = tapBtn.getBoundingClientRect();
            const centerX = (e.clientX || rect.left + rect.width / 2) - rect.left;
            const centerY = (e.clientY || rect.top + rect.height / 2) - rect.top;

            for (let i = 0; i < 6; i++) {
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle';
                
                const angle = Math.random() * Math.PI * 2;
                const distance = 30 + Math.random() * 30;
                const x = Math.cos(angle) * distance;
                const y = Math.sin(angle) * distance;

                sparkle.style.setProperty('--tw-translate-x', `${x}px`);
                sparkle.style.setProperty('--tw-translate-y', `${y}px`);
                sparkle.style.left = `${centerX}px`;
                sparkle.style.top = `${centerY}px`;

                coinContainer.appendChild(sparkle);

                setTimeout(() => {
                    sparkle.remove();
                }, 600);
            }
        }

        buyClickBtn.addEventListener('click', () => {
            if (state.score >= state.clickCost) {
                state.score -= state.clickCost;
                state.clickPower += 1;
                state.clickCost = Math.round(state.clickCost * 1.5);
                updateUI();
                saveGame();
            }
        });

        buyMinerBtn.addEventListener('click', () => {
            if (state.score >= state.minerCost) {
                state.score -= state.minerCost;
                state.cps += 1;
                state.minerCost = Math.round(state.minerCost * 1.6);
                updateUI();
                saveGame();
            }
        });

        buyFarmBtn.addEventListener('click', () => {
            if (state.score >= state.farmCost) {
                state.score -= state.farmCost;
                state.cps += 5;
                state.farmCost = Math.round(state.farmCost * 1.7);
                updateUI();
                saveGame();
            }
        });

        setInterval(() => {
            if (state.cps > 0) {
                state.score += state.cps;
                updateUI();
                saveGame();
            }
        }, 1000);

        function updateUI() {
            scoreEl.textContent = Math.floor(state.score).toLocaleString();
            clickPowerText.textContent = state.clickPower;
            cpsText.textContent = state.cps;

            clickCostEl.textContent = state.clickCost.toLocaleString();
            minerCostEl.textContent = state.minerCost.toLocaleString();
            farmCostEl.textContent = state.farmCost.toLocaleString();

            buyClickBtn.disabled = state.score < state.clickCost;
            buyMinerBtn.disabled = state.score < state.minerCost;
            buyFarmBtn.disabled = state.score < state.farmCost;

            // Actualizar rangos y barra
            if (state.score < 500) {
                userRankEl.textContent = "Novato 🐣";
                rankBarEl.style.width = `${(state.score / 500) * 100}%`;
            } else if (state.score < 5000) {
                userRankEl.textContent = "Trader 📈";
                rankBarEl.style.width = `${((state.score - 500) / 4500) * 100}%`;
            } else {
                userRankEl.textContent = "Ballena 🐋";
                rankBarEl.style.width = `100%`;
            }
        }

        function saveGame() {
            localStorage.setItem('crypto_survivor_save', JSON.stringify(state));
        }

        updateUI();
    </script>
</body>
</html>
