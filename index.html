<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Survivor</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes pulse-glow {
            0%, 100% { transform: scale(1); box-shadow: 0 0 20px rgba(16, 185, 129, 0.4); }
            50% { transform: scale(1.05); box-shadow: 0 0 35px rgba(16, 185, 129, 0.8); }
        }
        .crypto-coin {
            animation: pulse-glow 3s infinite;
        }
        .click-effect:active {
            transform: scale(0.92);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between p-4 font-sans select-none">

    <!-- Header / Info del usuario -->
    <header class="w-full max-w-md mx-auto flex justify-between items-center bg-slate-900/80 border border-slate-800 p-3 rounded-2xl backdrop-blur-md shadow-lg">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-emerald-500 to-cyan-500 flex items-center justify-center font-bold text-slate-950 text-lg shadow-md" id="user-avatar">CS</div>
            <div>
                <h1 id="user-name" class="font-bold text-sm text-emerald-400">Crypto Survivor</h1>
                <p class="text-xs text-slate-400">Rango: <span id="user-rank" class="text-amber-400 font-semibold">Novato</span></p>
            </div>
        </div>
        <div class="bg-slate-950 px-3 py-1 rounded-full border border-slate-800 text-xs text-emerald-400 font-mono" id="market-status">
            🟢 Bull Market
        </div>
    </header>

    <!-- Zona central: Contador y Moneda clickeable -->
    <main class="w-full max-w-md mx-auto flex flex-col items-center justify-center my-auto py-6">
        <div class="text-center mb-6">
            <p class="text-xs uppercase tracking-widest text-slate-400 mb-1 font-semibold">Balance Total</p>
            <div class="flex items-center justify-center space-x-2">
                <span class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-400 font-mono" id="score">0</span>
                <span class="text-xl font-bold text-emerald-500">USDT</span>
            </div>
            <p class="text-xs text-slate-500 mt-1">+<span id="click-power">1</span> por toque</p>
        </div>

        <!-- Botón principal de la moneda -->
        <button id="tap-btn" class="crypto-coin click-effect w-44 h-44 rounded-full bg-gradient-to-b from-emerald-400 to-emerald-700 flex flex-col items-center justify-center shadow-2xl border-4 border-emerald-300/40 relative active:brightness-110 transition-all">
            <span class="text-6xl filter drop-shadow-md">🪙</span>
            <span class="text-xs font-bold text-slate-950 uppercase tracking-wider mt-1 bg-white/20 px-3 py-0.5 rounded-full">¡MINAR!</span>
        </button>
    </main>

    <!-- Panel inferior / Estadísticas rápidas -->
    <footer class="w-full max-w-md mx-auto bg-slate-900/80 border border-slate-800 p-4 rounded-2xl backdrop-blur-md shadow-lg flex justify-around text-center">
        <div>
            <p class="text-xs text-slate-400">Por segundo</p>
            <p class="text-sm font-bold text-cyan-400 font-mono" id="cps">0.0</p>
        </div>
        <div class="border-r border-slate-800"></div>
        <div>
            <p class="text-xs text-slate-400">Total clics</p>
            <p class="text-sm font-bold text-amber-400 font-mono" id="total-taps">0</p>
        </div>
    </footer>

    <script>
        let score = 0;
        let totalTaps = 0;
        let clickPower = 1;

        const scoreEl = document.getElementById('score');
        const tapBtn = document.getElementById('tap-btn');
        const totalTapsEl = document.getElementById('total-taps');
        const userNameEl = document.getElementById('user-name');
        const userAvatarEl = document.getElementById('user-avatar');

        // Integración con Telegram WebApp si está disponible
        if (window.Telegram && window.Telegram.WebApp) {
            const tg = window.Telegram.WebApp;
            tg.expand();
            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                const user = tg.initDataUnsafe.user;
                userNameEl.textContent = user.first_name || "Crypto Survivor";
                if (user.first_name) {
                    userAvatarEl.textContent = user.first_name.charAt(0).toUpperCase();
                }
            }
        }

        // Evento de clic en la moneda
        tapBtn.addEventListener('click', () => {
            score += clickPower;
            totalTaps += 1;
            updateUI();
            
            // Vibración háptica en celulares si está soportado por Telegram
            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback) {
                window.Telegram.WebApp.HapticFeedback.impactOccurred('medium');
            }
        });

        function updateUI() {
            scoreEl.textContent = score.toLocaleString();
            totalTapsEl.textContent = totalTaps.toLocaleString();
        }
    </script>
</body>
</html>
